user                nginx;
worker_processes    2;

error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format  main  $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for" "$http_x_real_ip" "$http_x_client_ip";

    access_log  /dev/stdout  main;

    sendfile            on;
    keepalive_timeout   65;

    server {
        listen  80;
        root    /usr/share/nginx/html;

        index index.html index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.html;
            etag off;
            if_modified_since off;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|otf|ttf|eot|woff|woff2|css|js)$ {
            expires max;
            etag on;
            add_header Cache-Control "public, no-transform";
        }

        location ~* \.(svg|pdf)$ {
            expires max;
            etag on;
            add_header Cache-Control "public, no-transform";
        }
    }
}


